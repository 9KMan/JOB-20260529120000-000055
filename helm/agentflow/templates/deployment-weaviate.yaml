apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentflow.fullname" . }}-weaviate
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: weaviate
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "agentflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: weaviate
  template:
    metadata:
      labels:
        {{- include "agentflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: weaviate
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: weaviate
          image: "{{ .Values.weaviate.image.repository }}:{{ .Values.weaviate.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.weaviate.service.port }}
              protocol: TCP
          env:
            - name: QUERY_DEFAULTS_LIMIT
              value: "25"
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "false"
            - name: AUTHENTICATION_APIKEY_ENABLED
              value: "true"
            - name: AUTHENTICATION_APIKEY_ALLOWED_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentflow.fullname" . }}-secrets
                  key: weaviate-api-key
            - name: PERSISTENCE_DATA_PATH
              value: "/var/lib/weaviate"
            - name: ENABLE_MODULES
              value: "text2vec-openai,text2vec-cohere,text2vec-huggingface"
            - name: CLUSTER_HOSTNAME
              value: "node1"
          resources:
            {{- toYaml .Values.weaviate.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: weaviate-data
              mountPath: /var/lib/weaviate
      volumes:
        - name: weaviate-data
          {{- if .Values.weaviate.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agentflow.fullname" . }}-weaviate-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.weaviate.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentflow.fullname" . }}-weaviate-pvc
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: weaviate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.weaviate.persistence.size }}
  {{- if .Values.weaviate.persistence.storageClass }}
  storageClassName: {{ .Values.weaviate.persistence.storageClass }}
  {{- end }}
{{- end }}
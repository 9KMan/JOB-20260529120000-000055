{{- if not (hasKey .Values "existingSecret") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentflow.fullname" . }}-secrets
  labels:
    {{- include "agentflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "Values.secrets.database.url is required" .Values.secrets.database.url }}
  database-username: {{ required "Values.secrets.database.username is required" .Values.secrets.database.username }}
  database-password: {{ required "Values.secrets.database.password is required" .Values.secrets.database.password }}
  jwt-secret: {{ required "Values.secrets.jwt.secret is required" .Values.secrets.jwt.secret }}
  api-key: {{ required "Values.secrets.api.key is required" .Values.secrets.api.key }}
  weaviate-api-key: {{ required "Values.secrets.weaviate.apiKey is required" .Values.secrets.weaviate.apiKey }}
  redis-password: {{ .Values.secrets.redis.password | default (randAlphaNum 32) }}
{{- end }}
# Production overrides for AgentFlow Helm chart
# Usage: helm install agentflow ./helm/agentflow -f values.prod.yaml

# Global settings
replicaCount: 2

# Redis - Production settings with persistence
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  service:
    type: ClusterIP
    port: 6379
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard-rwo

# Weaviate - Production settings with larger resources
weaviate:
  enabled: true
  image:
    repository: semitechnologies/weaviate
    tag: "1.23.0"
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  persistence:
    enabled: true
    size: 50Gi
    storageClass: standard-rwo

# Orchestrator - Production with HPA enabled
orchestrator:
  image:
    repository: agentflow/orchestrator
    tag: "latest"
  service:
    type: ClusterIP
    port: 8001
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70

# API service - Production settings
api:
  image:
    repository: agentflow/api
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Frontend - Production settings
frontend:
  image:
    repository: agentflow/frontend
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

# Ingress - Production TLS settings
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
  hosts:
    - host: agentflow.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: agentflow-tls-prod
      hosts:
        - agentflow.example.com

# Tenant configuration - Production limits
tenant:
  id: "prod-default"
  name: "Production Tenant"
  maxAgents: 50
  maxConcurrentWorkflows: 20
  retentionDays: 90

# Required secrets (override via --set or external secrets manager)
secrets:
  database:
    url: "postgresql://user:password@postgres:5432/agentflow"
    username: "agentflow"
    password: "CHANGE_ME"
  jwt:
    secret: "CHANGE_ME_USE_STRONG_SECRET"
  api:
    key: "CHANGE_ME"
  weaviate:
    apiKey: "CHANGE_ME"
  redis:
    password: ""

# Config log level
config:
  logLevel: "INFO"
  corsOrigins: "https://agentflow.example.com"
  maxMessageLength: "50000"
  streamTimeoutSeconds: "600"